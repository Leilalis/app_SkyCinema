<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="register.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>

    <header class="nav"> 
        <a href="#" class="logo">SkyCinema</a> 

        <div class="overlay" id="overlay"></div>

        <nav class="menu"> 
        <a href="index.html">Главная</a> 
        <a href="register.html">Регистрация</a>
        </nav> 
        <button class="theme-toggle" id="themeBtn" aria-label="Переключить тему">Тема</button>
    </header> 
    
    <main class="register-main">
        <form class="register-form" id="loginForm" novalidate>
            <h1>Вход</h1>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" autocomplete="email" autofocus>
                <small class="error" id="emailError"></small>
            </div>

            <div class="form-group">
            <label for="password">Пароль</label>
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="Пароль">
                <button type="button" class="toggle-password" id="togglePassword">👁️</button>
            </div>
            <small class="error" id="passwordError"></small>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn" disabled>
                <span class="btn-text">Войти</span>
                <span class="btn-spinner"></span>
            </button>

            <p class="form-footer">
                Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
            </p>
        </form>
    </main>

    <div class="modal-overlay" id="successModal">
    <div class="modal">
        <div class="modal-icon">✅</div>
        <h2>Вход успешен!</h2>
        <p>С возвращением.</p>
        <button class="modal-btn" id="modalClose">Продолжить</button>
    </div>
    </div>
    
    <footer id="cont">
        <p>&copy; 2026, Лейла Мустафаева · ул. Марджани дом 86 · <a href="mailto:dorelidolai@gmail.com">dorelidolai@gmail.com</a></p>
    </footer>
    
    <script src="login.js"></script>
</body>
</html>
